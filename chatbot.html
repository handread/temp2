<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 客服 · 颜汐 YANXI AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2728%27 fill=%27%23B8355F%27/%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2713%27 fill=%27%232c2350%27/%3E%3Ccircle cx=%2746%27 cy=%2720%27 r=%274%27 fill=%27%23A9862C%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .chat-layout{display:grid;grid-template-columns:1fr .55fr;gap:1.6rem;align-items:flex-start}
  @media(max-width:860px){.chat-layout{grid-template-columns:1fr}}
  .chat-panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;height:640px;overflow:hidden}
  .chat-head{display:flex;align-items:center;gap:.8rem;padding:1rem 1.3rem;border-bottom:1px solid var(--line)}
  .chat-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(150deg,#c96b8a,#8a2447);display:grid;place-items:center;color:#fff;font-family:var(--serif);font-weight:700}
  .chat-head .name{font-weight:500;font-size:.94rem}
  .chat-head .status{font-size:.74rem;color:var(--teal);display:flex;align-items:center;gap:.35em}
  .chat-head .status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--teal)}
  .chat-body{flex:1;overflow-y:auto;padding:1.3rem;display:flex;flex-direction:column;gap:1rem}
  .msg{display:flex;gap:.7rem;max-width:82%}
  .msg.user{align-self:flex-end;flex-direction:row-reverse}
  .msg .av{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:.8rem;color:#fff}
  .msg.bot .av{background:linear-gradient(150deg,#c96b8a,#8a2447)}
  .msg.user .av{background:var(--indigo)}
  .msg .bubble{padding:.7em 1em;border-radius:12px;font-size:.88rem;line-height:1.65}
  .msg.bot .bubble{background:#F1F2F5;color:var(--ink);border-top-left-radius:2px}
  .msg.user .bubble{background:var(--ink);color:#fff;border-top-right-radius:2px}
  .msg .time{font-size:.65rem;color:var(--muted);margin-top:.3rem}
  .typing .bubble{display:flex;gap:.3em;align-items:center}
  .typing .dot{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:typingBounce 1.2s infinite}
  .typing .dot:nth-child(2){animation-delay:.15s}
  .typing .dot:nth-child(3){animation-delay:.3s}
  @keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
  .quick-row{display:flex;gap:.5rem;flex-wrap:wrap;padding:.8rem 1.3rem;border-top:1px solid var(--line)}
  .chat-input{display:flex;gap:.7rem;padding:1rem 1.3rem;border-top:1px solid var(--line)}
  .chat-input input{flex:1}
  .side-list{list-style:none;font-size:.86rem;color:var(--ink-soft)}
  .side-list li{padding:.55rem 0;border-bottom:1px solid var(--line);display:flex;gap:.6em}
  .side-list li:last-child{border-bottom:none}
  .side-list li::before{content:"→";color:var(--magenta)}
</style>
</head>
<body>

<div id="site-header"></div>

<section class="page-hero">
  <div class="wrap">
    <div class="breadcrumb"><a href="index.html">平台首页</a><span>/</span><span>AI 客服</span></div>
    <span class="kana">AI CONCIERGE</span>
    <h1>AI 简单客服</h1>
    <p class="lead">关键词智能问答,快速回复常见咨询,支持一键转接人工顾问。以下问答均为<b>预设规则演示</b>,非真实大模型接入。</p>
  </div>
</section>

<section style="padding-top:0">
  <div class="wrap chat-layout">
    <div class="chat-panel">
      <div class="chat-head">
        <div class="chat-avatar">汐</div>
        <div>
          <div class="name">小汐 · AI 客服</div>
          <div class="status">在线 · 演示模式</div>
        </div>
      </div>
      <div class="chat-body" id="chatBody"></div>
      <div class="quick-row" id="quickRow"></div>
      <div class="chat-input">
        <input type="text" id="chatInput" placeholder="输入您的问题,例如「预约流程」…">
        <button class="btn btn-primary" id="sendBtn">发送</button>
      </div>
    </div>

    <div>
      <div class="card reveal">
        <h3 style="margin-bottom:1rem">小汐可以帮您</h3>
        <ul class="side-list">
          <li>解答价格与项目咨询</li>
          <li>引导完成在线预约</li>
          <li>介绍 AI 皮肤分析</li>
          <li>说明会员积分与等级</li>
          <li>提供术后护理提示</li>
          <li>转接人工专属顾问</li>
        </ul>
        <a href="booking.html" class="btn btn-outline btn-block mt-2">直接前往预约系统 →</a>
      </div>
      <div class="card reveal mt-2">
        <p class="muted" style="font-size:.78rem;line-height:1.8">本客服为规则匹配演示,用于展示对话式交互与信息架构,不代表最终 AI 能力或真实响应速度。</p>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="assets/js/common.js"></script>
<script src="assets/js/mock-data.js"></script>
<script src="assets/js/chatbot.js"></script>
</body>
</html>
