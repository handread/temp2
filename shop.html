<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>臻选商城 · 依欣 YIXIN AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2728%27 fill=%27%23B8355F%27/%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2713%27 fill=%27%232c2350%27/%3E%3Ccircle cx=%2746%27 cy=%2720%27 r=%274%27 fill=%27%23A9862C%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=20260703-yixin">
<style>
  .prod-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;transition:transform .22s,box-shadow .22s,border-color .22s}
  .prod-card:hover{transform:translateY(-4px);box-shadow:0 16px 40px -20px rgba(20,30,54,.35);border-color:var(--magenta)}
  .prod-img{aspect-ratio:1;display:grid;place-items:center;position:relative}
  .prod-img .badge{position:absolute;top:.7rem;left:.7rem;font-size:.68rem;background:var(--magenta);color:#fff;padding:.25em .7em;border-radius:100px}
  .prod-body{padding:1.1rem 1.2rem}
  .prod-body .cat{font-size:.7rem;color:var(--muted)}
  .prod-body h4{font-family:var(--serif);font-size:.98rem;margin-top:.3rem;line-height:1.4}
  .prod-body .rating{font-size:.74rem;color:var(--gold);margin-top:.4rem}
  .prod-body .price-row{display:flex;align-items:baseline;gap:.5rem;margin-top:.6rem}
  .prod-body .price{font-family:var(--serif);font-weight:700;color:var(--magenta);font-size:1.1rem}
  .prod-body .orig{font-size:.78rem;color:var(--muted);text-decoration:line-through}

  .cart-row{display:flex;gap:.9rem;padding:1rem 0;border-bottom:1px solid var(--line)}
  .cart-row:last-child{border-bottom:none}
  .cart-thumb{width:56px;height:56px;border-radius:6px;flex:none}
  .cart-row .info{flex:1;min-width:0}
  .cart-row h5{font-size:.86rem;font-family:var(--serif)}
  .cart-row .price{font-size:.82rem;color:var(--magenta);margin-top:.3rem}
  .qty-ctrl{display:flex;align-items:center;gap:.5rem;margin-top:.5rem}
  .qty-ctrl button{width:22px;height:22px;border:1px solid var(--line);background:var(--surface);border-radius:4px;cursor:pointer;font-size:.8rem;line-height:1}
  .qty-ctrl button:hover{border-color:var(--magenta)}
  .cart-remove{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.78rem;text-decoration:underline}

  .modal-prod-img{aspect-ratio:4/3;border-radius:6px;margin-bottom:1.2rem}
  .qty-input{display:flex;align-items:center;gap:.8rem;margin:1rem 0}
  .qty-input button{width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;font-size:1rem}
  .qty-input span{min-width:24px;text-align:center;font-family:var(--serif);font-weight:700}

  .pay-option{display:flex;align-items:center;gap:.7rem;border:1px solid var(--line);border-radius:6px;padding:.8rem 1rem;cursor:pointer;margin-bottom:.6rem}
  .pay-option.sel{border-color:var(--magenta);background:#FBF6F8}
  .pay-option input{accent-color:var(--magenta)}

  .empty-cart{padding:3rem 1rem;text-align:center;color:var(--muted)}
</style>
</head>
<body>

<div id="site-header"></div>

<section class="page-hero">
  <div class="wrap">
    <div class="breadcrumb"><a href="index.html">平台首页</a><span>/</span><span>臻选商城</span></div>
    <span class="kana">CURATED SHOP</span>
    <h1>臻选商城</h1>
    <p class="lead">护肤精华、医美套餐与礼品卡,支持购物车与模拟下单流程。所有商品、库存与订单均为演示数据,不涉及真实支付。</p>
  </div>
</section>

<section style="padding-top:0">
  <div class="wrap">
    <div class="flex between center-y mt-1" style="flex-wrap:wrap;gap:1rem;margin-bottom:1.6rem">
      <div class="pillgroup" id="catFilter"></div>
      <button class="btn btn-outline btn-sm" id="openCartBtn">🛍️ 购物车 (<span id="cartCountLabel">0</span>)</button>
    </div>
    <div class="grid g4" id="productGrid"></div>
  </div>
</section>

<div id="site-footer"></div>

<!-- PRODUCT DETAIL MODAL -->
<div class="overlay" id="prodOverlay"></div>
<div class="modal" id="prodModal">
  <div class="modal-head">
    <h3>商品详情</h3>
    <button class="modal-close" data-close="prod">✕</button>
  </div>
  <div class="modal-body" id="prodModalBody"></div>
</div>

<!-- CART DRAWER -->
<div class="overlay" id="cartOverlay"></div>
<div class="drawer" id="cartDrawer">
  <div class="drawer-head">
    <h3>我的购物车</h3>
    <button class="modal-close" data-close="cart">✕</button>
  </div>
  <div class="drawer-body" id="cartBody"></div>
  <div class="drawer-foot">
    <div class="flex between center-y" style="margin-bottom:1rem">
      <span class="muted">合计</span>
      <span style="font-family:var(--serif);font-weight:900;font-size:1.3rem;color:var(--magenta)" id="cartTotal">¥0</span>
    </div>
    <button class="btn btn-primary btn-block" id="checkoutBtn">去结算</button>
  </div>
</div>

<!-- CHECKOUT MODAL -->
<div class="overlay" id="checkoutOverlay"></div>
<div class="modal" id="checkoutModal" style="width:min(520px,92vw)">
  <div class="modal-head">
    <h3 id="checkoutTitle">确认订单</h3>
    <button class="modal-close" data-close="checkout">✕</button>
  </div>
  <div class="modal-body">
    <div id="checkoutForm">
      <div class="field"><label>收货 / 联系人</label><input type="text" id="coName" value="陈小姐"></div>
      <div class="field"><label>手机号</label><input type="tel" id="coPhone" value="13800001234"></div>
      <div class="field"><label>地址(如为实体商品)</label><input type="text" id="coAddr" value="上海市静安区南京西路 1266 号"></div>
      <label>支付方式</label>
      <div class="mt-1">
        <label class="pay-option sel" data-pay><input type="radio" name="pay" checked> 微信支付</label>
        <label class="pay-option" data-pay><input type="radio" name="pay"> 支付宝</label>
        <label class="pay-option" data-pay><input type="radio" name="pay"> 信用卡</label>
      </div>
      <div class="summary-box" id="checkoutSummary" style="background:#FBF6F8;border:1px solid rgba(184,53,95,.2);border-radius:6px;padding:1.1rem 1.2rem;margin-top:1rem"></div>
      <button class="btn btn-primary btn-block mt-2" id="confirmPayBtn">确认支付</button>
    </div>
    <div id="checkoutSuccess" style="display:none;text-align:center;padding:1rem 0">
      <div class="success-icon" style="width:64px;height:64px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:1.8rem;margin:0 auto 1.2rem">✓</div>
      <h3>支付成功</h3>
      <p class="muted mt-1">订单编号 <b id="orderCode" style="color:var(--indigo)"></b></p>
      <button class="btn btn-ghost mt-2" data-close="checkout">完成</button>
    </div>
  </div>
</div>

<script src="assets/js/common.js?v=20260703-yixin"></script>
<script src="assets/js/mock-data.js"></script>
<script src="assets/js/shop.js"></script>
</body>
</html>
